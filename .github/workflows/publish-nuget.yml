name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vestara.sln

      - name: Build
        run: dotnet build Vestara.sln -c Release --no-restore

      - name: Test core
        run: dotnet test tests/Vestara.Tests/Vestara.Tests.csproj -c Release --no-build --no-restore

      - name: Test ASP.NET Core
        run: dotnet test tests/Vestara.AspNetCore.Tests/Vestara.AspNetCore.Tests.csproj -c Release --no-build --no-restore

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack src/Vestara/Vestara.csproj -c Release --no-build --no-restore -o artifacts
          dotnet pack src/Vestara.AspNetCore/Vestara.AspNetCore.csproj -c Release --no-build --no-restore -o artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Vestara
        run: >
          dotnet nuget push artifacts/Vestara.0.1.0.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - name: Publish Vestara.AspNetCore
        run: >
          dotnet nuget push artifacts/Vestara.AspNetCore.0.1.0.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
